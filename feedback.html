<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feedback — Duella</title>
  <meta name="description"
    content="Give us feedback or suggestions for Duella." />
  <link rel="canonical" href="https://joinduella.com/feedback" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Duella" />
  <meta property="og:title" content="Feedback — Duella" />
  <meta property="og:description" content="Give us feedback or suggestions for Duella." />
  <meta property="og:url" content="https://joinduella.com/feedback" />
  <meta property="og:image" content="https://joinduella.com/og-image.png" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Feedback — Duella" />
  <meta name="twitter:description" content="Give us feedback or suggestions for Duella." />
  <meta name="twitter:image" content="https://joinduella.com/og-image.png" />

  <!-- Favicons / app icons -->
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="msapplication-TileColor" content="#0e0f13">
  <meta name="msapplication-config" content="/browserconfig.xml">
  <meta name="theme-color" content="#0e0f13">

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <main class="legal legal--form">
    <a class="legal__back" href="/">← Back to Duella</a>

    <h1>Give us your feedback</h1>
    <p class="updated">We'd love to hear your thoughts on Duella. Drop your feedback or suggestions below.</p>

    <form class="beta-form" id="feedbackForm">
      <label class="field">
        <span>Name <em>(optional)</em></span>
        <input type="text" name="name" placeholder="Your name" autocomplete="name" />
      </label>

      <label class="field">
        <span>Email or phone number</span>
        <input type="text" name="contact" placeholder="you@email.com or +91 98765 43210" autocomplete="email"
          required />
      </label>

      <label class="field">
        <span>Feedback or suggestions</span>
        <textarea name="message" rows="4" placeholder="What's on your mind?" required></textarea>
      </label>

      <button type="submit" class="beta-form__submit">Submit feedback</button>
    </form>

    <p class="beta-form__status" id="feedbackStatus" role="status" aria-live="polite"></p>
  </main>

  <footer class="foot">
    <div class="foot__brand">
      <span class="foot__name"><img src="assets/duella_logo.svg" alt="" />Duella</span>
      <span class="foot__tag">Debate better since 2026</span>
    </div>
    <nav class="foot__links" aria-label="Footer">
      <a href="/faqs">FAQs</a>
      <a href="/blog">Blog</a>
      <a href="/releases">Releases</a>
      <a href="/terms">Terms of Service</a>
      <a href="/privacy">Privacy Policy</a>
      <a href="/data-deletion">Data Deletion</a>
      <a href="mailto:support@joinduella.com">Contact</a>
    </nav>
  </footer>

  <script>
    (function () {
      // Google Apps Script Web App URL — appends submissions to a Google Sheet.
      var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwDGUstbQ8pnRmtC4VxXiuOBWbPnwQne_6nhc8fXANJk1cYDEDmVecCPl76hnECDIIBqg/exec';

      var form = document.getElementById('feedbackForm');
      var status = document.getElementById('feedbackStatus');
      var submitBtn = form.querySelector('.beta-form__submit');

      form.addEventListener('submit', function (e) {
        e.preventDefault();

        if (SCRIPT_URL.indexOf('PASTE_YOUR') === 0) {
          status.textContent = 'Feedback form is not connected yet — email support@joinduella.com in the meantime.';
          status.className = 'beta-form__status is-error';
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Submitting…';

        fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: new FormData(form) })
          .then(function () {
            form.hidden = true;
            status.textContent = "Thank you for your feedback!";
            status.className = 'beta-form__status is-success';
          })
          .catch(function () {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Submit feedback';
            status.textContent = 'Something went wrong — email us at support@joinduella.com instead.';
            status.className = 'beta-form__status is-error';
          });
      });
    })();
  </script>
</body>

</html>
